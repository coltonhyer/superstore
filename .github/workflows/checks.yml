name: Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install gawk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gawk

      - name: Install jj 0.44.0 (Linux)
        if: runner.os == 'Linux'
        run: |
          archive=jj-v0.44.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/jj-vcs/jj/releases/download/v0.44.0/$archive"
          echo "0a07bab4641a55fd2bc2fd1563ba3a3f9a577584086ad74086a1c5b69b3ffce9  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/jj"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/jj"
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"

      - name: Install jj 0.44.0 (macOS)
        if: runner.os == 'macOS'
        run: |
          archive=jj-v0.44.0-aarch64-apple-darwin.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/jj-vcs/jj/releases/download/v0.44.0/$archive"
          echo "22b92ed109378a9638f0ae55ca7a7bdc9ef26aa60124215a1f04f6808623ba94  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/jj"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/jj"
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: rumdl
        run: |
          python -m pip install rumdl==0.3.2
          rumdl check --no-cache .
